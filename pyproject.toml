[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "declutter-context"
version = "0.4.0"
description = "Declutter your AI agent's context (CLAUDE.md / AGENTS.md) without losing a single rule, and prove it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "declutter contributors" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
]

[project.optional-dependencies]
# Exact tool versions so a new ruff/mypy release cannot turn CI red without a code change.
dev = ["pytest>=8,<10", "ruff==0.17.3", "mypy==2.4.1"]

[project.scripts]
declutter = "declutter_context.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
declutter_context = [
  "templates/**/*", "templates/*/*", "templates/*/*/*", "templates/*/*/*/*",
  "templates_reorg/*/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
